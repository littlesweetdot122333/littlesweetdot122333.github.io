    <h1>网络排查备忘</h1>
    <p>排查网络问题时，不要一开始就改配置。先分层确认：物理链路、IP 地址、默认路由、DNS、端口连通、业务进程。</p>
    <p>常用命令包括：</p>
    <ul>
      <li><code>ipconfig /all</code> 或 <code>ip addr</code></li>
      <li><code>route print</code> 或 <code>ip route</code></li>
      <li><code>nslookup</code></li>
      <li><code>tracert</code> 或 <code>traceroute</code></li>
      <li><code>Test-NetConnection</code> 或 <code>nc</code></li>
    </ul>
    <p>先证明问题在哪一层，再决定是否修改配置。</p>
